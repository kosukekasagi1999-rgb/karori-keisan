<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriLog</title>

<style>
:root{
  --bg:#141720;--surface:#222638;
  --border:rgba(255,255,255,0.12);
  --green:#a8ff6e;--orange:#fb923c;
  --text:#e8edf5;--text2:#8b92a8;
}

body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:sans-serif;
}

/* --- SUMMARY --- */
.summary{
  margin:16px;
  background:var(--surface);
  border-radius:16px;
  padding:16px;
}

/* --- BAR --- */
.bar{
  height:6px;
  background:rgba(255,255,255,.08);
  border-radius:4px;
  position:relative;
  margin-top:16px;
}

.bar-fill{
  height:100%;
  background:var(--green);
  border-radius:4px;
}

/* --- MARKER（改善版） --- */
.marker{
  position:absolute;
  top:-10px;
  width:2px;
  height:26px;
  background:currentColor;
}

.marker-label{
  position:absolute;
  top:-22px;
  font-size:10px;
  white-space:nowrap;
}

/* 左右で表示方向変える */
.marker.left .marker-label{
  left:0;
  transform:none;
}

.marker.right .marker-label{
  right:0;
  transform:none;
}

.marker.center .marker-label{
  left:50%;
  transform:translateX(-50%);
}
</style>
</head>

<body>

<div class="summary">
  <div style="margin-bottom:6px;color:var(--text2)">カロリー</div>
  <div style="font-size:20px;font-weight:bold;margin-bottom:10px">1500 kcal</div>

  <div class="bar">
    <div class="bar-fill" style="width:60%"></div>

    <!-- 目標 -->
    <div class="marker center" style="left:50%;color:var(--green)">
      <div class="marker-label">目標 2200</div>
    </div>

    <!-- 消費 -->
    <div class="marker right" style="left:90%;color:var(--orange)">
      <div class="marker-label">筋トレ 2700</div>
    </div>

  </div>
</div>

</body>
</html>
